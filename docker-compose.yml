services:
  db:
    image: postgres:16-alpine
    container_name: hara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hara_workshop_db
      POSTGRES_USER: hara_user
      POSTGRES_PASSWORD: hara_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hara_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hara_backend
    restart: unless-stopped
    command: sh -c 'python manage.py migrate && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000'
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - '8000:8000'
    environment:
      - DEBUG=True
      - SECRET_KEY=hara-workshop-production-docker-secret-key-2026
      - DATABASE_URL=postgresql://hara_user:hara_password@db:5432/hara_workshop_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8819328437:AAE20iWA_66JEj0qLSNmjh2jexmx6sDnOok}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID:--5374750855}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-1774429006}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-1774429006}
      - FRONTEND_URL=http://localhost:5173
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hara_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=hara-workshop-production-docker-secret-key-2026
      - DATABASE_URL=postgresql://hara_user:hara_password@db:5432/hara_workshop_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8819328437:AAE20iWA_66JEj0qLSNmjh2jexmx6sDnOok}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID:--5374750855}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-1774429006}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-1774429006}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - backend
      - redis

  telegram_bot:
    image: hara-workshop-backend:latest
    container_name: hara_telegram_bot
    restart: unless-stopped
    command: python -u manage.py run_telegram_bot
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - SECRET_KEY=hara-workshop-production-docker-secret-key-2026
      - DATABASE_URL=postgresql://hara_user:hara_password@db:5432/hara_workshop_db
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8819328437:AAE20iWA_66JEj0qLSNmjh2jexmx6sDnOok}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID:--5374750855}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-1774429006}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-1774429006}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - backend
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hara_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
