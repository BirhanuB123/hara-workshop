version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hara_workshop_db
      POSTGRES_USER: hara_user
      POSTGRES_PASSWORD: hara_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hara_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hara_backend
    restart: unless-stopped
    command: sh -c 'python manage.py migrate && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000'
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - '8000:8000'
    environment:
      - DEBUG=True
      - SECRET_KEY=hara-workshop-production-docker-secret-key-2026
      - DATABASE_URL=postgresql://hara_user:hara_password@db:5432/hara_workshop_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hara_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=hara-workshop-production-docker-secret-key-2026
      - DATABASE_URL=postgresql://hara_user:hara_password@db:5432/hara_workshop_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hara_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_media:
